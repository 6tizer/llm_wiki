name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (macOS)
        run: brew install protobuf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Check frontend build
        run: npx vite build

      - name: Frontend tests
        run: npm run test:mocks

      - name: Install sidecar dependencies
        run: npm --prefix src-tauri/sidecar install

      - name: Build sidecar binary
        run: npm --prefix src-tauri/sidecar run build:binary

      - name: Sidecar tests
        run: npm --prefix src-tauri/sidecar test

      - name: Prepare MCP server resources
        run: |
          npm --prefix mcp-server ci
          npm run mcp:build

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
